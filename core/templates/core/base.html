{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BarberFlow{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'core/images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}">
            <img src="{% static 'core/images/logo.png' %}" alt="Logo BarberFlow" class="brand-logo">
        </a>

        <nav>
            <a href="{% url 'home' %}">Início</a>

            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Meu painel</a>
            <form method="post" action="{% url 'logout' %}" class="nav-form">
                {% csrf_token %}
                <button type="submit" class="nav-button">Sair</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Entrar</a>
            <a href="{% url 'register' %}">Criar conta</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        BarberFlow — Conectando clientes e barbearias.
    </footer>
</body>

</html>
